[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "do-audit-scraper"
version = "0.1.0"
description = "Headless scraper of DigitalOcean audit logs (NDJSON output, Wazuh-ready)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "tenacity>=8.3",
    "filelock>=3.15",
    "pyotp>=2.9",
    "pyvirtualdisplay>=3.0; sys_platform == 'linux'",  # needs the Xvfb binary (apt install xvfb)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
do-audit = "do_audit_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/do_audit_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
